# Application Name
spring.application.name=blogcms

# Server Port
server.port=8080

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/blog-cms
spring.datasource.username=postgres
spring.datasource.password=abcd1234
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-min-256-bits-for-hmac-sha}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=2592000000

#File Storage Configuration
file.upload-dir=uploads
file.max-size=5242880
file.allowed-types=image/jpeg,image/png,image/gif,image/webp

#Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.aditya_nk.blogcms=DEBUG

# Hibernate statistics (for demonstrating N+1 query problem)
# Uncomment the following lines to see detailed query statistics
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE