# Application Name
spring.application.name=blogcms

# Server Port
server.port=8080

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/blog-cms
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:abcd1234}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-min-256-bits-for-hmac-sha}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=2592000000

#File Storage Configuration
file.upload-dir=uploads
file.max-size=5242880
file.allowed-types=image/jpeg,image/png,image/gif,image/webp

# Data seeding (set to true only for development)
app.seed.enabled=true
app.seed.authors=250
app.seed.subscribers=10000
app.seed.categories=10
app.seed.tags=20
app.seed.posts-per-author=40

# Redis Configuration
# Override REDIS_PASSWORD env var in production (leave blank for local dev with no auth)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms

# Cache TTL (in seconds) — referenced by RedisCacheConfig
cache.ttl.posts=300
cache.ttl.categories=600
cache.ttl.tags=600
cache.ttl.default=120

#Async / Threadpool
async.core-pool-size=4
async.max-pool-size=16
async.queue-capacity=200
async.thead-name-prefix=blogcms-async-

#Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.aditya_nk.blogcms=DEBUG
logging.file.name=logs/blog-cms.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# Hibernate statistics (for demonstrating N+1 query problem)
# Uncomment the following lines to see detailed query statistics
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Mailtrap SMTP (sandbox - for development/teaching only)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME:your_mailtrap_username}
spring.mail.password=${MAILTRAP_PASSWORD:your_mailtrap_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Rate Limiting (token-bucket via Bucket4j + Redis)
# Limits are enforced per authenticated user (keyed by username:role) or per IP for anonymous callers.
# Values are requests per hour. ADMIN uses Long.MAX_VALUE/2 in code — no property needed.
rate.limit.subscriber-requests-per-hour=100
rate.limit.author-requests-per-hour=500

# Image Generation (Imagen 3 via Google AI native API)
# Set to false to skip actual image generation and return a placeholder URL instead.
# Agent 1 (ImagePromptAgent) always runs — only the Imagen 3 call is skipped.
ai.image.enabled=true

# Google Gemini AI Configuration (via OpenAI-compatible endpoint)
# Gemini exposes an OpenAI-compatible REST API — no GCP project or gcloud CLI required.
# Get a free API key at https://aistudio.google.com/app/apikey
# Set GEMINI_API_KEY as an environment variable (IntelliJ run config or shell export).
spring.ai.openai.api-key=${GEMINI_API_KEY:your-gemini-api-key}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.options.model=gemini-3.6-flash
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=4096

# Cloudflare R2 Object Storage (S3-compatible)
# Only used when running with the "prod" profile — R2FileStorageServiceImpl
# replaces LocalFileStorageServiceImpl in that profile.
# Set these as environment variables (IntelliJ run config or shell export).
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:}
r2.public-url=${R2_PUBLIC_URL:}

# Scheduled Cleanup Jobs
cleanup.deleted-retention-days=30
cleanup.cron.purge-posts=0 0 2 * * *
cleanup.cron.purge-users=0 30 2 * * *
cleanup.cron.purge-tokens=0 0 * * * *
cleanup.cron.stats=0 0 */6 * * *